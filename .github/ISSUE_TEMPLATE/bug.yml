name: Bug
description: Something in Bukti Kemas does the wrong thing
title: ""
labels:
  - needs-triage
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Indonesian or English is fine. Do not attach a real packing video or a real receipt number.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140 on Windows
    validations:
      required: true
